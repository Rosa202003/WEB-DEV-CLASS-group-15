{% extends 'complaints/base.html' %}

{% block title %}Delete Complaint - Complaint System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0"><i class="fas fa-trash-alt me-2"></i>Delete Complaint</h4>
            </div>
            <div class="card-body">
                <p class="mb-4">Are you sure you want to delete the complaint <strong>{{ complaint.title }}</strong>? This action cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{% url 'complaints:complaint_detail' complaint.id %}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left me-1"></i>Cancel
                        </a>
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash me-1"></i>Delete Complaint
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
